<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#143c35"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon-192.png"><title>SmartBudget GPS</title><style>html,body{margin:0;height:100%;background:#f4f7f3;font-family:system-ui;color:#163c34}iframe{width:100%;height:calc(100dvh - 52px - env(safe-area-inset-bottom));border:0;display:block}#state{max-width:420px;margin:auto;padding:18vh 28px 40px}h1{font-size:32px;letter-spacing:-1px}p{line-height:1.7;color:#718479;font-size:14px}button{background:#143c35;color:white;border:0;border-radius:14px;padding:16px 24px;font:inherit;cursor:pointer}#directApp{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom));left:10px;background:#f4f7f3ed;color:#163c34;padding:8px 14px;border-radius:12px;font-size:12px;z-index:3;text-decoration:underline;white-space:nowrap;max-width:calc(100vw - 152px);overflow:hidden;text-overflow:ellipsis}#install{position:fixed;right:10px;bottom:calc(8px + env(safe-area-inset-bottom));z-index:2;padding:9px 14px;font-size:11px;box-shadow:0 3px 12px #123c3533}[hidden]{display:none!important}</style></head><body><button id="install" hidden>Installer sur Android</button><section id="state"><h1>SmartBudget <small>GPS</small></h1><p id="message">Connexion à votre budget…</p><button id="retry" hidden onclick="location.reload()">Réessayer</button></section><a id="directApp" hidden target="_blank" rel="noopener noreferrer">Ouvrir avec mon compte Google ↗</a><iframe id="app" title="SmartBudget — gestion budgétaire" hidden allow="clipboard-write" referrerpolicy="no-referrer"></iframe><script>
'use strict';const state=document.getElementById('state'),msg=document.getElementById('message'),frame=document.getElementById('app'),retry=document.getElementById('retry');let installing;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installing=e;document.getElementById('install').hidden=false;});document.getElementById('install').onclick=async()=>{if(!installing)return;await installing.prompt();installing=null;document.getElementById('install').hidden=true;};
async function connect(){if(!navigator.onLine){msg.textContent='Vous êtes hors connexion. Reconnectez-vous pour consulter les soldes et enregistrer une opération.';retry.hidden=false;return;}try{const response=await fetch('./config.json',{cache:'no-store'});if(!response.ok)throw new Error('Configuration indisponible.');const config=await response.json();if(!/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(config.appUrl||'')){msg.textContent='SmartBudget GPS est prêt. Son service Apps Script doit encore être déployé et relié à cette PWA.';return;}document.getElementById('directApp').href=config.appUrl;document.getElementById('directApp').hidden=false;frame.src=config.appUrl;frame.hidden=false;state.hidden=true;}catch(e){msg.textContent='Connexion impossible. Vérifiez votre accès Internet puis réessayez.';retry.hidden=false;}}
window.addEventListener('offline',()=>{frame.hidden=true;state.hidden=false;msg.textContent='Vous êtes hors connexion. Les écritures sont suspendues jusqu’à votre reconnexion.';retry.hidden=false;});window.addEventListener('online',connect);if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});connect();
</script></body></html>
